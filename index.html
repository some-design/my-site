<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some | website coming soon...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&family=Montserrat:wght@400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #ffffff; 
            color: #1a1a1a; 
            font-family: "Montserrat", sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            position: relative; 
            width: 100%;
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }
        a:hover {
            opacity: 0.5;
        }

        /* ----------------------------------------------------------------
           1. ロゴエリア（スマホでもDIN 2014の直線を100%再現）
        ---------------------------------------------------------------- */
        .logo-area {
            position: absolute;
            top: 10%;      
            left: 5%;      
        }

        .brand-logo {
            /* DIN特有の「縦長かつ幾何学的な直線」を再現するフォントを指定 */
            font-family: "Barlow Semi Condensed", sans-serif;
            font-size: 82px;       /* 縦長フォントに合わせてサイズを微調整 */
            font-weight: 700;      /* 強力なBold */
            letter-spacing: -0.01em; /* DIN特有のソリッドな詰まり具合 */
            line-height: 0.8;
            text-transform: lowercase;
        }

        /* ----------------------------------------------------------------
           2. 中央「website coming soon...」
        ---------------------------------------------------------------- */
        .center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            text-align: center;
            width: 100%;
        }

        .coming-soon-text {
            font-size: 24px;
            font-weight: 400;      
            letter-spacing: 0.12em; 
        }

        /* ----------------------------------------------------------------
           3. 左下インフォメーション
        ---------------------------------------------------------------- */
        .footer-info-area {
            position: absolute;
            bottom: 8%;    
            left: 5%;      
            font-size: 15px;
            line-height: 1.7;
            letter-spacing: 0.08em;
        }

        .address-block {
            margin-bottom: 8px;
        }

        .phone-block {
            margin-bottom: 25px; 
        }

        .url-block {
            font-weight: 400;
        }

        /* ----------------------------------------------------------------
           スマホ表示の「はっきり・くっきり」最適化
        ---------------------------------------------------------------- */
        @media (max-width: 768px) {
            .logo-area {
                top: 8%;
                left: 8%;
            }
            .brand-logo {
                font-size: 68px; /* スマホでも丸まらず、DINの鋭さを保つサイズ */
            }
            .coming-soon-text {
                font-size: 18px; 
            }
            .footer-info-area {
                font-size: 13px; 
                bottom: 6%;
                left: 8%;
                right: 8%;
            }
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <h1 class="brand-logo">some</h1>
    </div>

    <div class="center-area">
        <p class="coming-soon-text">website coming soon...</p>
    </div>

    <div class="footer-info-area">
        <div class="address-block">
            531, 6-35-3 Jingumae, Shibuya-ku,<br>
            Tokyo, 150-0001, Japan
        </div>
        <div class="phone-block">
            +81-3-6823-8759<br>
            +81-9-5604-9221
        </div>
        <div class="url-block">
            <a href="#">www.some-design.com</a>
        </div>
    </div>

</body>
</html>
