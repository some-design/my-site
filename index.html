<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some | website coming soon...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:XTRA,YTAS@468,750&display=swap" rel="stylesheet">
    
    <style>
        /* ----------------------------------------------------------------
           全体共通設定（すべての文字をDIN Boldに固定）
        ---------------------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #ffffff; 
            color: #1a1a1a; 
            
            /* 画面上のすべての文字のベースを、DIN特有の「横幅を抑えた直線型（Condensed）の極太」に強制固定 */
            font-family: "Roboto Flex", sans-serif;
            font-variation-settings: "XTRA" 468, "YTAS" 750; /* DINの骨格比率をプログラムで固定 */
            font-weight: 800; /* 全身をカチッとしたBoldに */
            -webkit-font-smoothing: antialiased;
            
            position: relative; 
            width: 100%;
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }
        a:hover {
            opacity: 0.5;
        }

        /* ----------------------------------------------------------------
           1. ロゴエリア（some）
        ---------------------------------------------------------------- */
        .logo-area {
            position: absolute;
            top: 10%;      
            left: 5%;      
        }

        .brand-logo {
            font-size: 80px;       
            font-weight: 800;      
            letter-spacing: -0.02em; /* ソリッドな詰まり具合 */
            line-height: 0.8;
            text-transform: lowercase;
        }

        /* ----------------------------------------------------------------
           2. 中央「website coming soon...」（こちらもDIN Boldに！）
        ---------------------------------------------------------------- */
        .center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            text-align: center;
            width: 100%;
        }

        .coming-soon-text {
            font-size: 26px;
            font-weight: 800;      
            letter-spacing: 0.08em; /* Boldに合わせた美しい間隔 */
        }

        /* ----------------------------------------------------------------
           3. 左下インフォメーション（住所・電話・URLもすべてDIN Boldに！）
        ---------------------------------------------------------------- */
        .footer-info-area {
            position: absolute;
            bottom: 8%;    
            left: 5%;      
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: 0.05em;
            font-weight: 800;
        }

        .address-block {
            margin-bottom: 8px;
        }

        .phone-block {
            margin-bottom: 25px; 
        }

        .url-block {
            font-weight: 800;
        }

        /* ----------------------------------------------------------------
           スマホ・PC共通の「はっきり・くっきり」最適化
        ---------------------------------------------------------------- */
        @media (max-width: 768px) {
            .logo-area {
                top: 8%;
                left: 8%;
            }
            .brand-logo {
                font-size: 68px; /* スマホでも圧倒的な存在感を維持 */
            }
            .coming-soon-text {
                font-size: 20px; 
            }
            .footer-info-area {
                font-size: 14px; 
                bottom: 6%;
                left: 8%;
                right: 8%;
            }
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <h1 class="brand-logo">some</h1>
    </div>

    <div class="center-area">
        <p class="coming-soon-text">website coming soon...</p>
    </div>

    <div class="footer-info-area">
        <div class="address-block">
            531, 6-35-3 Jingumae, Shibuya-ku,<br>
            Tokyo, 150-0001, Japan
        </div>
        <div class="phone-block">
            +81-3-6823-8759<br>
            +81-9-5604-9221
        </div>
        <div class="url-block">
            <a href="#">www.some-design.com</a>
        </div>
    </div>

</body>
</html>
