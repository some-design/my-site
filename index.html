<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some | website coming soon...</title>
    
    <style>
        /* ----------------------------------------------------------------
           0. お手持ちのフォントデータをサーバーから直接読み込む設定
        ---------------------------------------------------------------- */
        @font-face {
            font-family: "My-DIN-2014-Bold";
            /* サーバー上のフォントファイルを指定（同じフォルダに置いてある前提） */
            src: url("din2014-bold.otf") format("opentype"); 
            font-weight: 700;
            font-style: normal;
        }

        /* ----------------------------------------------------------------
           1. 全体共通設定（すべての文字をお手持ちのDIN 2014 Boldに固定）
        ---------------------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #ffffff; 
            color: #1a1a1a; 
            
            /* 上記で設定したフォント名を指定 */
            font-family: "My-DIN-2014-Bold", sans-serif;
            font-weight: 700;
            -webkit-font-smoothing: antialiased;
            
            position: relative; 
            width: 100%;
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }
        a:hover {
            opacity: 0.5;
        }

        /* ----------------------------------------------------------------
           2. ロゴエリア（some）
        ---------------------------------------------------------------- */
        .logo-area {
            position: absolute;
            top: 10%;      
            left: 5%;      
        }

        .brand-logo {
            font-size: 76px;       
            letter-spacing: -0.01em; 
            line-height: 1;
            text-transform: lowercase;
        }

        /* ----------------------------------------------------------------
           3. 中央「website coming soon...」
        ---------------------------------------------------------------- */
        .center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            text-align: center;
            width: 100%;
        }

        .coming-soon-text {
            font-size: 24px;
            letter-spacing: 0.1em; 
        }

        /* ----------------------------------------------------------------
           4. 左下インフォメーション
        ---------------------------------------------------------------- */
        .footer-info-area {
            position: absolute;
            bottom: 8%;    
            left: 5%;      
            font-size: 15px;
            line-height: 1.65;
            letter-spacing: 0.08em;
        }

        .address-block {
            margin-bottom: 8px;
        }

        .phone-block {
            margin-bottom: 25px; 
        }

        /* ----------------------------------------------------------------
           スマホ・PC共通のレスポンシブ最適化
        ---------------------------------------------------------------- */
        @media (max-width: 768px) {
            .logo-area {
                top: 8%;
                left: 8%;
            }
            .brand-logo {
                font-size: 60px; 
            }
            .coming-soon-text {
                font-size: 18px; 
            }
            .footer-info-area {
                font-size: 13px; 
                bottom: 6%;
                left: 8%;
                right: 8%;
            }
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <h1 class="brand-logo">some</h1>
    </div>

    <div class="center-area">
        <p class="coming-soon-text">website coming soon...</p>
    </div>

    <div class="footer-info-area">
        <div class="address-block">
            531, 6-35-3 Jingumae, Shibuya-ku,<br>
            Tokyo, 150-0001, Japan
        </div>
        <div class="phone-block">
            +81-3-6823-8759<br>
            +81-9-5604-9221
        </div>
        <div class="url-block">
            <a href="#">www.some-design.com</a>
        </div>
    </div>

</body>
</html>
