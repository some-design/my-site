<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some | website coming soon...</title>
    
    <link rel="stylesheet" href="https://use.typekit.net/af/d305e7/0000000000000000774bda3b/30/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n7&v=3">
    
    <style>
        /* ----------------------------------------------------------------
           1. 全体共通設定（全ての文字をDIN 2014 Boldに完全固定）
        ---------------------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #ffffff; 
            color: #1a1a1a; 
            
            /* 読み込んだ本物のDIN 2014フォントを画面全体に適用 */
            font-family: "din-2014", sans-serif;
            font-weight: 700; /* Bold (n7) */
            font-style: normal;
            -webkit-font-smoothing: antialiased;
            
            position: relative; 
            width: 100%;
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }
        a:hover {
            opacity: 0.5;
        }

        /* ----------------------------------------------------------------
           2. ロゴエリア（some）
        ---------------------------------------------------------------- */
        .logo-area {
            position: absolute;
            top: 10%;      
            left: 5%;      
        }

        .brand-logo {
            font-size: 76px;       
            font-weight: 700; /* DIN 2014 Bold */
            letter-spacing: -0.01em; /* ソリッドな詰まり */
            line-height: 1;
            text-transform: lowercase;
        }

        /* ----------------------------------------------------------------
           3. 中央「website coming soon...」
        ---------------------------------------------------------------- */
        .center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            text-align: center;
            width: 100%;
        }

        .coming-soon-text {
            font-size: 24px;
            font-weight: 700; /* DIN 2014 Bold */
            letter-spacing: 0.1em; /* ゆったりとした空気感 */
        }

        /* ----------------------------------------------------------------
           4. 左下インフォメーション（住所・電話・URL）
        ---------------------------------------------------------------- */
        .footer-info-area {
            position: absolute;
            bottom: 8%;    
            left: 5%;      
            font-size: 15px;
            line-height: 1.65;
            letter-spacing: 0.08em;
            font-weight: 700; /* DIN 2014 Bold */
        }

        .address-block {
            margin-bottom: 8px;
        }

        .phone-block {
            margin-bottom: 25px; 
        }

        .url-block {
            font-weight: 700;
        }

        /* ----------------------------------------------------------------
           スマホ・PC共通の「はっきり・くっきり」最適化
        ---------------------------------------------------------------- */
        @media (max-width: 768px) {
            .logo-area {
                top: 8%;
                left: 8%;
            }
            .brand-logo {
                font-size: 60px; 
            }
            .coming-soon-text {
                font-size: 18px; 
            }
            .footer-info-area {
                font-size: 13px; 
                bottom: 6%;
                left: 8%;
                right: 8%;
            }
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <h1 class="brand-logo">some</h1>
    </div>

    <div class="center-area">
        <p class="coming-soon-text">website coming soon...</p>
    </div>

    <div class="footer-info-area">
        <div class="address-block">
            531, 6-35-3 Jingumae, Shibuya-ku,<br>
            Tokyo, 150-0001, Japan
        </div>
        <div class="phone-block">
            +81-3-6823-8759<br>
            +81-9-5604-9221
        </div>
        <div class="url-block">
            <a href="#">www.some-design.com</a>
        </div>
    </div>

</body>
</html>
