<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some | website coming soon...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ----------------------------------------------------------------
           全体共通設定（画像をそのまま再現するベース）
        ---------------------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #ffffff; /* 完全な白背景 */
            color: #1a1a1a; /* 画像で使用されている深い墨黒 */
            font-family: "DIN 2014", "Montserrat", sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            
            /* 画面全体を1枚のキャンバスとして、絶対配置の基準にする */
            position: relative; 
            width: 100%;
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }
        a:hover {
            opacity: 0.5;
        }

        /* ----------------------------------------------------------------
           1. 左上のロゴ配置（DIN 2014 Bold / 全小文字）
        ---------------------------------------------------------------- */
        .logo-area {
            position: absolute;
            top: 10%;      /* 上からの位置（バランスを見て調整可能） */
            left: 5%;      /* 左からの位置 */
        }

        .brand-logo {
            font-size: 76px;       /* はっきり、くっきりとした大きなロゴサイズ */
            font-weight: 700;      /* DIN 2014 Bold の太さ */
            letter-spacing: -0.01em; /* 画像に合わせた絶妙な詰まり具合 */
            line-height: 1;
            text-transform: lowercase;
        }

        /* ----------------------------------------------------------------
           2. 中央の「website coming soon...」
        ---------------------------------------------------------------- */
        .center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* 完全に画面の真中央に固定 */
            text-align: center;
            width: 100%;
        }

        .coming-soon-text {
            font-size: 24px;
            font-weight: 300;      /* すっきりとした細めのウエイト */
            letter-spacing: 0.1em; /* 文字の間の美しい空気感 */
        }

        /* ----------------------------------------------------------------
           3. 左下のインフォメーション（住所・連絡先）
        ---------------------------------------------------------------- */
        .footer-info-area {
            position: absolute;
            bottom: 8%;    /* 下からの位置 */
            left: 5%;      /* 左からの位置 */
            font-size: 15px;
            line-height: 1.65;
            letter-spacing: 0.08em;
            font-weight: 400;
        }

        .address-block {
            margin-bottom: 5px;
        }

        .phone-block {
            margin-bottom: 25px; /* 電話番号とURLの間に画像通りの広い猶予 */
        }

        .url-block {
            font-weight: 400;
        }

        /* ----------------------------------------------------------------
           スマホ表示用の微調整（レスポンシブ）
        ---------------------------------------------------------------- */
        @media (max-width: 768px) {
            .brand-logo {
                font-size: 52px; /* スマホではロゴを少しだけ縮小 */
            }
            .coming-soon-text {
                font-size: 18px; /* 中央の文字もスマホに最適化 */
            }
            .footer-info-area {
                font-size: 13px; /* 下部の文字を少し小さくして、画面内に収める */
                bottom: 5%;
                left: 6%;
            }
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <h1 class="brand-logo">some</h1>
    </div>

    <div class="center-area">
        <p class="coming-soon-text">website coming soon...</p>
    </div>

    <div class="footer-info-area">
        <div class="address-block">
            531, 6-35-3 Jingumae, Shibuya-ku,<br>
            Tokyo, 150-0001, Japan
        </div>
        <div class="phone-block">
            +81-3-6823-8759<br>
            +81-9-5604-9221
        </div>
        <div class="url-block">
            <a href="#">www.some-design.com</a>
        </div>
    </div>

</body>
</html>
