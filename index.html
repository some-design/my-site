<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some-design | Better for some</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff; /* 画像の背景色に合わせて変更してください */
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        .coming-soon-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 最初は両方隠す（画面がガタつくのを防ぐため） */
        .pc-only, .sp-only {
            display: none !important;
        }

        /* 【スマホ】画面幅が767px以下のときの設定 */
        @media (max-width: 767px) {
            .sp-only {
                display: block !important;
            }
        }

        /* 【PC】画面幅が768px以上のときの設定 */
        @media (min-width: 768px) {
            .pc-only {
                display: block !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="main_sp.jpg" alt="Better for some" class="coming-soon-img sp-only">
        <img src="main_pc.jpg" alt="Better for some" class="coming-soon-img pc-only">
    </div>
</body>
</html>
